name: CI - Mobile

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        required: true
        default: all
        type: choice
        options: [all, ios, android]
      profile:
        description: "EAS build profile"
        required: true
        default: preview
        type: choice
        options: [development, preview, production]
      submit:
        description: "Submit after build"
        required: true
        default: false
        type: boolean
  push:
    tags: ["mobile-v*"]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: ./node_modules/.bin/tsc -p apps/mobile/tsconfig.json --noEmit

  build:
    name: EAS Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets['EXPO_TOKEN'] }}

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        working-directory: apps/mobile
        shell: bash
        env:
          DISPATCH_PLATFORM: ${{ inputs.platform || 'all' }}
          DISPATCH_PROFILE:  ${{ inputs.profile  || 'preview' }}
          DISPATCH_SUBMIT:   ${{ inputs.submit   || 'false' }}
          EXPO_TOKEN:        ${{ secrets['EXPO_TOKEN'] }}
          EAS_PROJECT_ID:    ${{ secrets['EAS_PROJECT_ID'] }}
        run: |
          set -euo pipefail
          [ -z "${EXPO_TOKEN:-}" ]    && echo "::error::EXPO_TOKEN is required."    && exit 1
          [ -z "${EAS_PROJECT_ID:-}" ] && echo "::error::EAS_PROJECT_ID is required." && exit 1
          args=(build --platform "${DISPATCH_PLATFORM}" --profile "${DISPATCH_PROFILE}" --non-interactive)
          [ "${DISPATCH_SUBMIT}" = "true" ] && args+=(--auto-submit)
          eas "${args[@]}"
