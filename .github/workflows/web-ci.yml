name: CI - Web

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Extra image tag (e.g. staging)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: |
          ./node_modules/.bin/tsc -p packages/db/tsconfig.json   --noEmit
          ./node_modules/.bin/tsc -p packages/api/tsconfig.json  --noEmit
          ./node_modules/.bin/tsc -p packages/auth/tsconfig.json --noEmit
          ./node_modules/.bin/tsc -p apps/web/tsconfig.json      --noEmit

      - run: pnpm lint

  docker:
    name: Build and push
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.event_name != 'pull_request'
    outputs:
      tags:   ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    env:
      APP_URL: https://skaddosh
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=ci,enable=${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_URL=${{ env.APP_URL }}

      - name: Job summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Image pushed"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Docker smoke test (PRs only) ─────────────────────────────────────────────
  docker-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skaddosh
          POSTGRES_USER: skaddosh
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral CI secret
        shell: bash
        run: |
          auth_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$auth_secret"
          echo "BETTER_AUTH_SECRET=$auth_secret" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: skaddosh:pr-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_URL=http://localhost:3000

      - name: Start container
        run: |
          docker run -d --name skaddosh-test -p 3000:3000 \
            --network host \
            -e DATABASE_URL="postgresql://skaddosh@localhost:5432/skaddosh" \
            -e BETTER_AUTH_SECRET \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e NEXT_PUBLIC_APP_URL=http://localhost:3000 \
            skaddosh:pr-test

      - name: Wait for server
        run: |
          for i in $(seq 1 24); do
            curl -fsS http://localhost:3000/ -o /dev/null && exit 0
            echo "[$i/24] waiting…"
            sleep 5
          done
          echo "Server did not become healthy in time" && exit 1

      - name: Verify response
        run: curl -fsS http://localhost:3000/ -o /dev/null

      - name: Cleanup
        if: always()
        run: docker rm -f skaddosh-test || true
