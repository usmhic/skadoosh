####################################################################
# main branch → signed Android AAB → Google Play Console
#
# Independent of the iOS release pipeline: if TestFlight upload fails,
# the Play upload is unaffected, and vice versa.
####################################################################
name: Release - Mobile Android (Play Store)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android-release.yml"
  workflow_dispatch:

concurrency:
  group: mobile-android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build & publish to Play Console
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile

      - name: Prebuild native Android project
        env:
          MOBILE_BUILD_NUMBER: ${{ github.run_number }}
          EXPO_PUBLIC_API_URL: ${{ vars.PROD_API_URL || 'https://api.skaddosh.com' }}
        run: npx expo prebuild --platform android --no-install

      - name: Decode signing keystore and Play Console service account
        run: |
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Build & upload (fastlane android_release)
        run: bundle exec fastlane android android_release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          GOOGLE_PLAY_JSON_KEY_PATH: ${{ runner.temp }}/play-service-account.json
          GOOGLE_PLAY_TRACK: ${{ vars.GOOGLE_PLAY_TRACK || 'production' }}
          GOOGLE_PLAY_RELEASE_STATUS: ${{ vars.GOOGLE_PLAY_RELEASE_STATUS || 'draft' }}
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME || 'com.osascloud.skadoosh' }}

      - name: Remove decoded credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/play-service-account.json"

      - uses: actions/upload-artifact@v4
        with:
          name: skadoosh-android-release-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 90
