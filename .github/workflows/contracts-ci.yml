name: CI - Contracts

on:
  push:
    branches: [main, dev]
    paths:
      - "packages/contracts/**"
      - ".github/workflows/contracts-*.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "packages/contracts/**"
      - ".github/workflows/contracts-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @skaddosh/contracts

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci
      - name: ABI is in sync with the contracts
        run: node scripts/export-abi.mjs --check

  slither:
    name: Static analysis (Slither)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @skaddosh/contracts

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install slither-analyzer==0.11.6
      - run: slither . --config-file slither.config.json
