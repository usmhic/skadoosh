version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    # Pause scheduled version PRs; security alerts/updates remain separate.
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    # Pause scheduled version PRs; security alerts/updates remain separate.
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
